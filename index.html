<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Basecamp — Outdoor Educators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --bg: #FFF8E7;
  --cream: #FFDF97;
  --orange: #FF5E1A;
  --orange-dark: #E04E0F;
  --navy: #172C36;
  --navy-light: #2A4452;
  --text: #172C36;
  --muted: #6B7C85;
  --white: #FFFFFF;
  --card: #FFFFFF;
  --border: #E8E0D0;
  --success: #2E7D32;
  --warning: #F9A825;
  --danger: #C62828;
  --radius: 16px;
  --shadow: 0 4px 24px rgba(23,44,54,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
}
/* Homepage */
.homepage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 32px 24px;
  text-align: center;
}
.logo {
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -1px;
  color: var(--navy);
  margin-bottom: 8px;
}
.logo span { color: var(--orange); }
.tagline {
  font-size: 18px;
  color: var(--muted);
  margin-bottom: 48px;
  font-weight: 400;
}
.cta-group {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}
.btn {
  display: block;
  width: 100%;
  padding: 18px 24px;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.15s ease;
  font-family: inherit;
}
.btn-primary {
  background: var(--orange);
  color: white;
}
.btn-primary:hover { background: var(--orange-dark); }
.btn-secondary {
  background: white;
  color: var(--navy);
  border: 2px solid var(--border);
}
.btn-secondary:hover { border-color: var(--orange); }
.login-link {
  margin-top: 24px;
  color: var(--muted);
  font-size: 15px;
}
.login-link a { color: var(--orange); text-decoration: none; font-weight: 500; }

/* Auth screens */
.auth-screen {
  padding: 24px;
  min-height: 100vh;
}
.auth-screen h2 { font-size: 28px; margin-bottom: 8px; }
.auth-screen p { color: var(--muted); margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--navy);
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 16px;
  font-family: inherit;
  background: white;
  color: var(--text);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--orange);
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  text-decoration: none;
  font-size: 15px;
  margin-bottom: 24px;
  cursor: pointer;
}

/* Dashboard */
.dashboard {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding-bottom: 80px;
}
.header {
  padding: 16px 20px;
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 { font-size: 20px; font-weight: 600; }
.content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: white;
  border-top: 1px solid var(--border);
  display: flex;
  padding: 8px 0 12px;
  z-index: 100;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: none;
  font-family: inherit;
}
.tab.active { color: var(--orange); }
.tab svg { width: 24px; height: 24px; }

/* Cards & lists */
.card {
  background: white;
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.card-title { font-weight: 600; margin-bottom: 4px; }
.card-sub { font-size: 14px; color: var(--muted); }
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.badge-success { background: #E8F5E9; color: var(--success); }
.badge-warning { background: #FFF8E1; color: #F57F17; }
.badge-danger { background: #FFEBEE; color: var(--danger); }
.badge-neutral { background: #F5F5F5; color: var(--muted); }

.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}
.empty-state h3 { color: var(--navy); margin-bottom: 8px; font-weight: 500; }

/* Document list */
.doc-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.doc-item:last-child { border-bottom: none; }
.doc-icon {
  width: 44px;
  height: 44px;
  background: var(--cream);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.doc-info { flex: 1; }
.doc-name { font-weight: 500; }
.doc-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(23,44,54,0.4);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 200;
}
.modal {
  background: white;
  width: 100%;
  max-width: 480px;
  border-radius: 20px 20px 0 0;
  padding: 24px;
  max-height: 85vh;
  overflow-y: auto;
}
.modal h3 { margin-bottom: 16px; font-size: 20px; }
.modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}
.modal-actions .btn { flex: 1; }

/* Sharing */
.company-card {
  background: white;
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.share-toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 15px;
}
.share-toggle:last-child { border-bottom: none; }

/* Calendar simple */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 12px;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  background: white;
  border: 1px solid var(--border);
}
.cal-day.unavailable { background: #FFEBEE; color: var(--danger); }
.cal-day.past { opacity: 0.4; cursor: default; }

/* Work log */
.log-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.log-item:last-child { border-bottom: none; }

/* Toast */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--navy);
  color: white;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 14px;
  z-index: 300;
  opacity: 0;
  transition: opacity 0.3s;
}
.toast.show { opacity: 1; }

.section-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin: 20px 0 10px;
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const DOC_TYPES = [
  { id: 'scrc', name: 'SCRC / Police Check', icon: '🛡️' },
  { id: 'firstaid', name: 'First Aid', icon: '🩹' },
  { id: 'lifeguard', name: 'Lifeguard', icon: '🏊' },
  { id: 'kayaking', name: 'Kayaking', icon: '🛶' },
  { id: 'climbing', name: 'Rock Climbing', icon: '🧗' },
  { id: 'wfr', name: 'WFR', icon: '🏕️' },
  { id: 'lnt', name: 'Leave No Trace', icon: '🌿' },
  { id: 'hkid', name: 'HKID', icon: '🪪' },
  { id: 'passport', name: 'Passport', icon: '📘' },
  { id: 'visa', name: 'Visa', icon: '📄' },
  { id: 'contract', name: 'Contract', icon: '📝' },
  { id: 'other', name: 'Other', icon: '📎' }
];

const COMPANY_RATES = {
  'shed': {
    'Lead': { 'Half day': 700, 'Full day': 1400, 'Quarter day': 500, 'Overnight': 1000 },
    'Support': { 'Half day': 500, 'Full day': 1000, 'Quarter day': 350, 'Overnight': 700 },
    'Specialist': { 'Full day': 1300 },
    'Junior': { 'Allowance': 100 }
  },
  'bloom': {
    'Lead': { 'Half day': 650, 'Full day': 1300, 'Quarter day': 450, 'Overnight': 900 },
    'Support': { 'Half day': 450, 'Full day': 900, 'Quarter day': 300, 'Overnight': 600 }
  },
  'trail': {
    'Lead': { 'Full day': 1500, 'Overnight': 1200 },
    'Support': { 'Full day': 1100, 'Overnight': 800 }
  },
  'ridge': {
    'Lead': { 'Half day': 800, 'Full day': 1600 },
    'Support': { 'Half day': 550, 'Full day': 1100 }
  }
};

const DEMO_COMPANIES = [
  { id: 'shed', name: 'The Shed', logo: '🏠' },
  { id: 'bloom', name: 'Bloom Academy', logo: '🌸' },
  { id: 'trail', name: 'Trail Outdoor', logo: '⛰️' },
  { id: 'ridge', name: 'Ridge Camps', logo: '🏕️' }
];
  { id: 'shed', name: 'The Shed', logo: '🏠' },
  { id: 'bloom', name: 'Bloom Academy', logo: '🌸' },
  { id: 'trail', name: 'Trail Outdoor', logo: '⛰️' },
  { id: 'ridge', name: 'Ridge Camps', logo: '🏕️' }
];

let state = {
  user: null,
  view: 'home', // home, login, signup-educator, signup-company, dashboard
  tab: 'home',
  documents: [],
  workLogs: [],
  companies: [],
  invites: [],
  requests: [],
  profile: {
    name: '',
    email: '',
    photo: '',
    bio: '',
    specialties: '',
    emergency: '',
    health: { allergies: '', conditions: '', notes: '' },
    bank: { name: '', bank: '', account: '', fps: '' },
    availability: {} // date string -> 'unavailable' | 'available'
  }
};

function loadState() {
  try {
    const saved = localStorage.getItem('basecamp_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch(e) {}
  // Seed demo data if first time
  if (!state.companies.length) {
    state.companies = DEMO_COMPANIES.map(c => ({ ...c, connected: false, shared: {} }));
  }
  if (!state.invites.length) {
    state.invites = [
      { id: 'inv1', companyId: 'shed', companyName: 'The Shed', status: 'pending' },
      { id: 'inv2', companyId: 'bloom', companyName: 'Bloom Academy', status: 'pending' }
    ];
  }
  if (!state.requests.length) {
    state.requests = [
      { id: 'req1', companyId: 'shed', companyName: 'The Shed', items: ['bank'], status: 'pending', type: 'payroll' }
    ];
  }
}

function saveState() {
  localStorage.setItem('basecamp_state', JSON.stringify(state));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function render() {
  const app = document.getElementById('app');
  if (!state.user && state.view === 'home') {
    app.innerHTML = renderHomepage();
  } else if (state.view === 'login') {
    app.innerHTML = renderLogin();
  } else if (state.view === 'signup-educator') {
    app.innerHTML = renderSignupEducator();
  } else if (state.view === 'signup-company') {
    app.innerHTML = renderSignupCompany();
  } else if (state.user) {
    app.innerHTML = renderDashboard();
  } else {
    state.view = 'home';
    render();
  }
  attachListeners();
}

function renderHomepage() {
  return `
    <div class="homepage">
      <div class="logo">Base<span>camp</span></div>
      <div class="tagline">One place for outdoor educators<br>and the companies they work with</div>
      <div class="cta-group">
        <button class="btn btn-primary" onclick="goSignupEducator()">Sign up as Educator</button>
        <button class="btn btn-secondary" onclick="goSignupCompany()">Sign up as Outdoor Company</button>
      </div>
      <div class="login-link">Already have an account? <a href="#" onclick="goLogin(); return false;">Log in</a></div>
    </div>
  `;
}

function renderLogin() {
  return `
    <div class="auth-screen">
      <div class="back-link" onclick="goHome()">← Back</div>
      <h2>Welcome back</h2>
      <p>Log in to your Basecamp account</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Log in</button>
      <div class="login-link" style="text-align:center; margin-top:16px;">
        <a href="#" onclick="goSignupEducator(); return false;">Create educator account</a>
      </div>
    </div>
  `;
}

function renderSignupEducator() {
  return `
    <div class="auth-screen">
      <div class="back-link" onclick="goHome()">← Back</div>
      <h2>Create educator account</h2>
      <p>Takes less than a minute</p>
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="signup-name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Create a password">
      </div>
      <button class="btn btn-primary" onclick="doSignupEducator()">Create account</button>
    </div>
  `;
}

function renderSignupCompany() {
  return `
    <div class="auth-screen">
      <div class="back-link" onclick="goHome()">← Back</div>
      <h2>Company account</h2>
      <p>Coming soon in the next phase.<br>For now, explore the educator side.</p>
      <button class="btn btn-primary" onclick="goSignupEducator()">Create educator account instead</button>
    </div>
  `;
}

function renderDashboard() {
  const tabs = [
    { id: 'home', label: 'Home', icon: homeIcon },
    { id: 'documents', label: 'Documents', icon: docIcon },
    { id: 'share', label: 'Share', icon: shareIcon },
    { id: 'pay', label: 'Pay', icon: payIcon },
    { id: 'profile', label: 'Profile', icon: profileIcon }
  ];
  return `
    <div class="dashboard">
      <div class="header">
        <h1>${tabTitle()}</h1>
        <div style="font-size:14px; color:var(--muted);">${state.profile.name || 'Educator'}</div>
      </div>
      <div class="content" id="tab-content">
        ${renderTabContent()}
      </div>
      <div class="tab-bar">
        ${tabs.map(t => `
          <button class="tab ${state.tab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">
            ${t.icon()}
            <span>${t.label}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function tabTitle() {
  const titles = { home: 'Home', documents: 'Documents', share: 'Sharing', pay: 'Work & Pay', profile: 'Profile' };
  return titles[state.tab] || 'Basecamp';
}

function renderTabContent() {
  switch(state.tab) {
    case 'home': return renderHomeTab();
    case 'documents': return renderDocumentsTab();
    case 'share': return renderShareTab();
    case 'pay': return renderPayTab();
    case 'profile': return renderProfileTab();
    default: return '';
  }
}

function renderHomeTab() {
  const pendingInvites = state.invites.filter(i => i.status === 'pending');
  const pendingRequests = state.requests.filter(r => r.status === 'pending');
  const completeness = calculateCompleteness();
  return `
    ${pendingInvites.length ? `
      <div class="card" style="border-left: 4px solid var(--orange);">
        <div class="card-title">Pending invitations</div>
        ${pendingInvites.map(inv => `
          <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong>${inv.companyName}</strong>
              <div class="card-sub">wants to connect with you</div>
            </div>
            <button class="btn btn-primary" style="width:auto; padding:10px 16px; font-size:14px;" onclick="acceptInvite('${inv.id}')">Accept</button>
          </div>
        `).join('')}
      </div>
    ` : ''}
    ${pendingRequests.length ? `
      <div class="card" style="border-left: 4px solid var(--warning);">
        <div class="card-title">Document requests</div>
        ${pendingRequests.map(req => `
          <div style="margin-top:12px;">
            <strong>${req.companyName}</strong> is requesting: ${req.items.map(i => i === 'bank' ? 'Bank details (for payroll)' : i).join(', ')}
            <div style="margin-top:8px; display:flex; gap:8px;">
              <button class="btn btn-primary" style="width:auto; padding:8px 14px; font-size:14px;" onclick="approveRequest('${req.id}')">Share</button>
              <button class="btn btn-secondary" style="width:auto; padding:8px 14px; font-size:14px;" onclick="declineRequest('${req.id}')">Decline</button>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}
    <div class="card">
      <div class="card-title">Profile completeness</div>
      <div style="margin-top:8px; height:8px; background:#eee; border-radius:4px; overflow:hidden;">
        <div style="width:${completeness}%; height:100%; background:var(--orange); border-radius:4px;"></div>
      </div>
      <div class="card-sub" style="margin-top:6px;">${completeness}% complete</div>
    </div>
    <div class="empty-state" style="padding:32px 0;">
      <h3>Welcome to Basecamp</h3>
      <p>Upload your documents, set availability, and share only what you choose with each company.</p>
    </div>
  `;
}

function calculateCompleteness() {
  let score = 0;
  if (state.profile.name) score += 15;
  if (state.profile.bio) score += 10;
  if (state.documents.length > 0) score += 25;
  if (state.documents.some(d => d.type === 'scrc')) score += 15;
  if (state.profile.bank.account) score += 15;
  if (Object.keys(state.profile.availability).length > 0) score += 10;
  if (state.profile.health.allergies || state.profile.health.conditions) score += 10;
  return Math.min(100, score);
}

function renderDocumentsTab() {
  return `
    <button class="btn btn-primary" onclick="openUploadModal()" style="margin-bottom:16px;">+ Upload document</button>
    ${state.documents.length === 0 ? `
      <div class="empty-state">
        <h3>No documents yet</h3>
        <p>Upload your certifications, SCRC, HKID, and more. You control who sees them.</p>
      </div>
    ` : `
      <div class="card">
        ${state.documents.map(doc => `
          <div class="doc-item">
            <div class="doc-icon">${getDocIcon(doc.type)}</div>
            <div class="doc-info">
              <div class="doc-name">${getDocName(doc.type)}</div>
              <div class="doc-meta">
                ${doc.expiry ? 'Expires ' + formatDate(doc.expiry) : 'No expiry'} 
                ${doc.nameMatch ? ' · Name match ✅' : doc.nameConfirmed ? ' · Name confirmed' : ''}
                ${doc.verified ? ' · Checked' : ' · Limited check'}
              </div>
            </div>
            <button onclick="deleteDoc('${doc.id}')" style="background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px;">×</button>
          </div>
        `).join('')}
      </div>
    `}
  `;
}

function getDocIcon(type) {
  return DOC_TYPES.find(d => d.id === type)?.icon || '📎';
}
function getDocName(type) {
  return DOC_TYPES.find(d => d.id === type)?.name || type;
}

function renderShareTab() {
  const connected = state.companies.filter(c => c.connected);
  const pending = state.invites.filter(i => i.status === 'pending');
  return `
    ${pending.length ? `
      <div class="section-title">Pending invitations</div>
      ${pending.map(inv => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>${inv.companyName}</strong>
            <button class="btn btn-primary" style="width:auto; padding:8px 16px; font-size:14px;" onclick="acceptInvite('${inv.id}')">Review & Accept</button>
          </div>
        </div>
      `).join('')}
    ` : ''}
    <div class="section-title">Connected companies</div>
    ${connected.length === 0 ? `
      <div class="empty-state">
        <h3>No companies yet</h3>
        <p>When a company invites you, it will appear here. You choose exactly what to share.</p>
      </div>
    ` : connected.map(c => `
      <div class="company-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <strong>${c.logo} ${c.name}</strong>
          <span class="badge badge-success">Connected</span>
        </div>
        <div class="section-title" style="margin-top:0;">Shared with this company</div>

async function previewAndAnalyze() {
  const fileInput = document.getElementById('doc-file');
  const file = fileInput.files[0];
  const preview = document.getElementById('analysis-preview');
  const content = document.getElementById('analysis-content');
  if (!file) { preview.style.display = 'none'; return; }

  preview.style.display = 'block';
  content.innerHTML = 'Reading document…';

  if (!file.type.startsWith('image/')) {
    content.innerHTML = 'PDF or non-image file — basic acceptance only. Image OCR works best for verification.';
    return;
  }

  try {
    const result = await Tesseract.recognize(file, 'eng', { logger: m => {} });
    const text = result.data.text || '';
    const analysis = analyzeDocumentText(text);
    window._lastAnalysis = analysis;
    window._lastExtractedText = text;

    let html = '';
    if (analysis.nameFound) {
      const match = analysis.nameMatchesUser;
      html += `<div>Name on document: <strong>${analysis.nameFound}</strong> ${match ? '✅ matches your profile' : '⚠️ does not match your profile name'}</div>`;
    } else {
      html += `<div>Name: not clearly found</div>`;
    }
    if (analysis.expiry) html += `<div>Expiry: <strong>${analysis.expiry}</strong></div>`;
    if (analysis.issueDate) html += `<div>Issue / given date: ${analysis.issueDate}</div>`;
    if (analysis.certType) html += `<div>Detected type: ${analysis.certType}</div>`;
    html += `<div style="margin-top:6px; font-size:12px; color:#888;">Raw text length: ${text.length} chars</div>`;
    content.innerHTML = html || 'No clear fields extracted.';

    // Name mismatch confirmation
    const nameConfirm = document.getElementById('name-confirm');
    if (analysis.nameFound && !analysis.nameMatchesUser) {
      nameConfirm.style.display = 'block';
    } else {
      nameConfirm.style.display = 'none';
    }

    // Type mismatch - actionable message
    const selectedType = document.getElementById('doc-type').value;
    const typeReject = document.getElementById('type-reject');
    const selectedLabel = DOC_TYPES.find(d => d.id === selectedType)?.name || selectedType;
    const isTypeMismatch = analysis.detectedTypeId && analysis.detectedTypeId !== selectedType;
    if (isTypeMismatch) {
      typeReject.style.display = 'block';
      typeReject.innerHTML = `
        You're uploading a <strong>${analysis.certType}</strong> document, but you selected <strong>${selectedLabel}</strong>.<br>
        <button class="btn btn-secondary" style="margin-top:8px; width:auto; padding:8px 12px; font-size:14px;" onclick="document.getElementById('doc-type').value='${analysis.detectedTypeId}'; this.closest('#type-reject').style.display='none'; document.getElementById('save-doc-btn').disabled=false;">Change type to ${analysis.certType}</button>
        <div style="margin-top:6px; font-size:13px;">Or re-upload the correct document.</div>
      `;
      document.getElementById('save-doc-btn').disabled = true;
    } else {
      typeReject.style.display = 'none';
      document.getElementById('save-doc-btn').disabled = false;
    }

    // Auto-fill expiry if found
    if (analysis.expiry) {
      const expInput = document.getElementById('doc-expiry');
      if (expInput && !expInput.value) {
        const d = parseLooseDate(analysis.expiry);
        if (d) expInput.value = d.toISOString().split('T')[0];
      }
    }
  } catch (err) {
    content.innerHTML = 'Could not read document: ' + (err.message || 'unknown error');
  }
}

function isTypeCompatible(selectedId, detectedLabel) {
  const map = {
    scrc: ['SCRC', 'Police', 'Sexual Conviction'],
    firstaid: ['First Aid'],
    lifeguard: ['Lifeguard'],
    kayaking: ['Kayak'],
    climbing: ['Climbing'],
    wfr: ['WFR', 'Wilderness'],
    lnt: ['Leave No Trace', 'LNT'],
    hkid: ['HKID'],
    passport: ['Passport'],
    visa: ['Visa']
  };
  const keywords = map[selectedId] || [];
  return keywords.some(k => detectedLabel.toLowerCase().includes(k.toLowerCase()));
}

function analyzeDocumentText(text) {
  const lower = text.toLowerCase();
  const userName = (state.profile.name || '').toLowerCase().trim();
  const analysis = { 
    nameFound: null, 
    nameMatchesUser: false, 
    expiry: null, 
    issueDate: null, 
    certType: null,
    detectedTypeId: null,
    rawTextSnippet: text.slice(0, 300)
  };

  // Stronger certificate type detection
  const typeKeywords = [
    { id: 'scrc', keywords: ['scrc', 'sexual conviction', 'police check', 'criminal record', 'conviction record'], label: 'SCRC / Police Check' },
    { id: 'firstaid', keywords: ['first aid', 'first-aid', 'cpr', 'aed'], label: 'First Aid' },
    { id: 'lifeguard', keywords: ['lifeguard', 'life guard', 'pool lifeguard'], label: 'Lifeguard' },
    { id: 'kayaking', keywords: ['kayak', 'kayaking', 'canoe', 'paddling'], label: 'Kayaking' },
    { id: 'climbing', keywords: ['climbing', 'rock climb', 'belay', 'abseil'], label: 'Rock Climbing' },
    { id: 'wfr', keywords: ['wilderness first', 'wfr', 'wilderness responder'], label: 'WFR' },
    { id: 'lnt', keywords: ['leave no trace', 'lnt'], label: 'Leave No Trace' },
    { id: 'hkid', keywords: ['hong kong identity', 'hkid', 'identity card', 'h.k.i.d'], label: 'HKID' },
    { id: 'passport', keywords: ['passport'], label: 'Passport' },
    { id: 'visa', keywords: ['visa'], label: 'Visa' }
  ];

  for (const t of typeKeywords) {
    if (t.keywords.some(k => lower.includes(k))) {
      analysis.certType = t.label;
      analysis.detectedTypeId = t.id;
      break;
    }
  }

  // Better date extraction
  const dateRegex = /(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4}|\d{4}[\/\-\.]\d{1,2}[\/\-\.]\d{1,2})/g;
  const allDates = [...text.matchAll(dateRegex)].map(m => m[1]);
  const expiryContext = /expir|valid until|valid to|expires|expiry|valid from/i;
  for (const d of allDates) {
    const idx = text.indexOf(d);
    const context = text.slice(Math.max(0, idx - 30), idx + 30);
    if (expiryContext.test(context)) {
      analysis.expiry = d;
      break;
    }
  }
  if (!analysis.expiry && allDates.length) analysis.expiry = allDates[allDates.length - 1];
  if (allDates.length) analysis.issueDate = allDates[0];

  // Stronger name matching
  if (userName) {
    const parts = userName.split(/\s+/).filter(p => p.length > 1);
    const matches = parts.filter(p => lower.includes(p));
    if (matches.length >= Math.min(2, parts.length) || (parts.length === 1 && matches.length === 1)) {
      analysis.nameFound = state.profile.name;
      analysis.nameMatchesUser = true;
    } else {
      // Try to extract a name-like line
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 4 && l.length < 50);
      const nameLine = lines.find(l => /^[A-Z][a-zA-Z]+(\s+[A-Z][a-zA-Z]+){1,3}$/.test(l));
      if (nameLine) analysis.nameFound = nameLine;
    }
  }

  return analysis;
}

function parseLooseDate(str) {
  if (!str) return null;
  const cleaned = str.replace(/[^\d\/\-\.]/g, '');
  const d = new Date(cleaned);
  return isNaN(d.getTime()) ? null : d;
}

function saveDocument() {
  const type = document.getElementById('doc-type').value;
  const expiry = document.getElementById('doc-expiry').value;
  const fileInput = document.getElementById('doc-file');
  const analysis = window._lastAnalysis || {};

  // Block if type mismatch
  if (analysis.certType && !isTypeCompatible(type, analysis.certType)) {
    showToast('Upload rejected — wrong document type');
    return;
  }

  // Name mismatch requires confirmation
  if (analysis.nameFound && !analysis.nameMatchesUser) {
    const confirmed = document.getElementById('confirm-name-mismatch')?.checked;
    if (!confirmed) {
      showToast('Please confirm the name on the document is correct');
      return;
    }
  }

  const doc = {
    id: 'doc_' + Date.now(),
    type,
    expiry: expiry || analysis.expiry || null,
    fileName: fileInput.files[0]?.name || 'document',
    verified: !!(analysis.nameMatchesUser || (analysis.certType && isTypeCompatible(type, analysis.certType))),
    nameMatch: analysis.nameMatchesUser || false,
    nameConfirmed: analysis.nameFound && !analysis.nameMatchesUser,
    extracted: analysis,
    uploadedAt: new Date().toISOString()
  };
  state.documents.push(doc);
  saveState();
  document.querySelector('.modal-overlay').remove();
  showToast(doc.nameMatch ? 'Document saved & name matched' : 'Document saved (name confirmed)');
  render();
}

function confirmAcceptInvite(id) {
  const inv = state.invites.find(i => i.id === id);
  if (!inv) return;
  let company = state.companies.find(c => c.id === inv.companyId);
  if (!company) {
    company = { id: inv.companyId, name: inv.companyName, logo: '🏢', connected: true, shared: {} };
    state.companies.push(company);
  }
  company.connected = true;
  company.shared = company.shared || {};
  DOC_TYPES.slice(0,5).forEach(dt => {
    const cb = document.getElementById('share-' + dt.id);
    if (cb && cb.checked) company.shared[dt.id] = true;
  });
  if (document.getElementById('share-bank')?.checked) company.shared.bank = true;
  if (document.getElementById('share-health')?.checked) company.shared.health = true;
  if (document.getElementById('share-avail')?.checked) company.shared.availability = true;
  inv.status = 'accepted';
  saveState();
  document.querySelector('.modal-overlay').remove();
  showToast('Connected with ' + inv.companyName);
  render();
}

function toggleShare(companyId, key, value) {
  const c = state.companies.find(x => x.id === companyId);
  if (c) {
    c.shared = c.shared || {};
    c.shared[key] = value;
    saveState();
  }
}

function renderRatesSummary(companyId) {
  const rates = COMPANY_RATES[companyId];
  if (!rates) return 'No rates defined yet.';
  let lines = [];
  for (const [role, types] of Object.entries(rates)) {
    const parts = Object.entries(types).map(([t, r]) => `${t}: HK$${r}`).join(', ');
    lines.push(`<div><strong>${role}</strong> — ${parts}</div>`);
  }
  return lines.join('') || 'No rates defined yet.';
}
  const companyId = document.getElementById('log-company')?.value;
  const role = document.getElementById('log-role')?.value;
  const type = document.getElementById('log-type')?.value;
  const preview = document.getElementById('rate-preview');
  if (!preview || !companyId || !role || !type) return;
  const rates = COMPANY_RATES[companyId] || {};
  const rate = rates[role]?.[type] || rates[role]?.['Allowance'];
  const company = state.companies.find(c => c.id === companyId);
  if (rate) {
    preview.textContent = `${company?.name || companyId} rate: HK$${rate}${type === 'Overnight' ? ' (additional per night)' : ''}`;
  } else {
    preview.textContent = 'No rate defined for this company / role / type';
  }
}

function saveWorkLog() {
  const date = document.getElementById('log-date').value;
  const companyId = document.getElementById('log-company').value;
  const company = state.companies.find(c => c.id === companyId);
  const role = document.getElementById('log-role').value;
  const sessionType = document.getElementById('log-type').value;
  const rates = COMPANY_RATES[companyId] || {};
  const rate = rates[role]?.[sessionType] || rates[role]?.['Allowance'] || 0;
  const log = {
    id: 'log_' + Date.now(),
    date,
    companyId,
    companyName: company?.name || 'Unknown',
    role,
    sessionType,
    rate,
    notes: document.getElementById('log-notes').value
  };
  state.workLogs.push(log);
  saveState();
  document.querySelector('.modal-overlay').remove();
  showToast('Work log saved · HK$' + rate);
  render();
}

  };

}

function approveRequest(id) {
  const req = state.requests.find(r => r.id === id);
  if (req) {
    req.status = 'approved';
    let c = state.companies.find(x => x.id === req.companyId);
    if (!c) {
      c = { id: req.companyId, name: req.companyName, logo: '🏢', connected: true, shared: {} };
      state.companies.push(c);
    }
    c.connected = true;
    c.shared = c.shared || {};
    req.items.forEach(item => { c.shared[item] = true; });
    saveState();
    showToast('Shared with ' + req.companyName + (req.items.includes('bank') ? ' (bank details for payroll)' : ''));
    render();
  }
}
function declineRequest(id) {
  const req = state.requests.find(r => r.id === id);
  if (req) {
    req.status = 'declined';
    saveState();
    render();
  }
}

function renderCalendar() {
  const cal = document.getElementById('calendar');
  if (!cal) return;
  const today = new Date();
  let viewDate = state.calViewDate ? new Date(state.calViewDate) : new Date(today.getFullYear(), today.getMonth(), 1);
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleString('en', { month: 'long', year: 'numeric' });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <button onclick="changeCalMonth(-1)" style="background:none; border:none; font-size:18px; cursor:pointer;">‹</button>
      <strong>${monthName}</strong>
      <button onclick="changeCalMonth(1)" style="background:none; border:none; font-size:18px; cursor:pointer;">›</button>
    </div>
    <div class="calendar-grid">
  `;
  // Empty cells for start of week
  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day" style="visibility:hidden;"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const key = date.toISOString().split('T')[0];
    const status = state.profile.availability[key];
    const isPast = date < new Date(today.getFullYear(), today.getMonth(), today.getDate());
    html += `<div class="cal-day ${status || ''} ${isPast ? 'past' : ''}" onclick="${isPast ? '' : `toggleAvail('${key}')`}">${d}</div>`;
  }
  html += '</div>';
  cal.innerHTML = html;
  state.calViewDate = viewDate.toISOString();
}

function changeCalMonth(delta) {
  const current = state.calViewDate ? new Date(state.calViewDate) : new Date();
  current.setMonth(current.getMonth() + delta);
  state.calViewDate = current.toISOString();
  renderCalendar();
}

function toggleAvail(date) {
  const current = state.profile.availability[date];
  if (current === 'unavailable') {
    delete state.profile.availability[date];
  } else {
    state.profile.availability[date] = 'unavailable';
  }
  saveState();
  renderCalendar();
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
}

function attachListeners() {
  // Re-render calendar if on profile
  if (state.tab === 'profile') setTimeout(renderCalendar, 50);
}

// Init
loadState();
if (state.user) {
  state.view = 'dashboard';
}
render();
</script>
